# Classical baseline experiment: LayerNorm + sinusoidal + ReLU + MHA
# Launch: python scripts/train.py --config configs/experiments/baseline_layernorm_sinusoidal_relu_mha.yaml

includes:
  - configs/default.yaml
  - configs/data/smoke.yaml
  - configs/model/base_small.yaml
  - configs/train/baseline_train.yaml

run:
  name: baseline_layernorm_sinusoidal_relu_mha
  seed: 42
  output_dir: runs

model:
  # written out so a diff against a swap config shows the one change
  norm: layernorm
  positional: sinusoidal
  feedforward: relu
  attention: mha

# Smoke corpus, so this runs before TinyStories is downloaded.
# Point the data include at configs/data/tinystories.yaml after `make prepare-data`.
