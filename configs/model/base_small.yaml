# Small baseline model for local / Colab / Kaggle iteration
# Classical stack: LayerNorm + sinusoidal + ReLU + MHA

model:
  vocab_size: 8000
  hidden_size: 384
  num_layers: 6
  num_heads: 6
  num_kv_heads: 6
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  norm_eps: 1.0e-5
  tie_weights: true
  norm: layernorm
  positional: sinusoidal
  feedforward: relu
  attention: mha
