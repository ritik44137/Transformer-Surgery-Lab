# Default configuration for Transformer Surgery Lab
# Override via experiment configs in configs/experiments/

run:
  name: tsl-run
  seed: 42
  output_dir: runs

data:
  dataset: tinystories
  raw_dir: data/raw
  processed_dir: data/processed
  tokenizer_dir: data/tokenizer
  seq_len: 256
  train_split: 0.95

model:
  vocab_size: 32000
  hidden_size: 384
  num_layers: 6
  num_heads: 6
  num_kv_heads: 6
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  norm: layernorm
  positional: sinusoidal
  feedforward: relu
  attention: mha

train:
  max_steps: 5000
  batch_size: 32
  eval_interval: 500
  log_interval: 50
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 200
  grad_clip: 1.0
  scheduler: cosine

benchmark:
  batch_size: 8
  seq_len: 256
  num_warmup: 3
  num_iters: 10

artifacts:
  checkpoint_dir: checkpoints
  save_every: 1000
